# Alembic 配置 —— 数据库迁移（满足「所有数据存 MySQL，格式版本化」约束）
#
# 连接字符串**不写在这里**：由 backend/alembic/env.py 通过
# app.config（即 os.getenv("DATABASE_URL")）读取，避免硬编码任何凭据。

[alembic]
script_location = alembic
prepend_sys_path = .
# 迁移文件名带时间戳，便于排序与追溯
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
# 版本号按时间顺序（多人协作时减少冲突）
version_path_separator = os
timezone = UTC

[post_write_hooks]
# 可选：自动格式化生成的迁移脚本（未安装 black 时会报错，故默认关闭）
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
