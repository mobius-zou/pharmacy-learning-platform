# Ruff 配置：**棘轮策略（ratchet）**
#
# 现状（基线见 docs/audit-fix/lint-baseline.md）：
#   用 ruff 默认规则集检查会有 213 条存量告警（多为 B008/BLE001/UP037 等风格与
#   "函数调用作为默认参数" 的 FastAPI 惯用写法）。一次性清零不现实，
#   直接全量阻塞又会让 CI 长期红灯、促使别人绕过门禁。
#
# 因此这里只启用**当前已经 100% 通过**、且能拦住最严重问题（未定义名称、
# 语法级错误、无效比较）的规则集，把它作为**阻塞门禁**；
# 其余规则作为 advisory 在 CI 里报告（lint-advisory job）。
#
# 升级路径：每清理一类存量告警，就往 select 里加一条规则，只增不减。

line-length = 100
target-version = "py312"

[lint]
select = [
    "E9",   # 语法/运行时错误（E902 等）
    "F63",  # 无效比较
    "F7",   # 语法相关（F701/F702/F704...）
    "F82",  # 未定义名称（真正会导致 NameError 的问题）
]
# 迁移脚本与本地脚本不参与（它们的风格与运行时代码不同）
exclude = ["alembic/versions", "scripts"]
