[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers --tb=short
markers =
    db: 需要本机 MySQL 的集成测试（未配置 DATABASE_URL 时自动跳过）
    network: 需要访问外网（如 PubMed）的测试，网络不可用时自动跳过
    semantic: 需要 sentence-transformers 模型（未安装/模型不可用时自动跳过）
    ocr: 需要系统 tesseract 二进制（未安装时自动跳过）
filterwarnings =
    ignore::DeprecationWarning
