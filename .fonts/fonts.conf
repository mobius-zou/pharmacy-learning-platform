<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  仅用于本机截图/E2E：WSL 发行版没有中文字体，会把汉字渲染成方块。
  这里把 Windows 的字体目录加进 fontconfig 搜索路径（不拷贝、不入库）。
  通过 FONTCONFIG_FILE 指向本文件生效，不影响应用运行时。
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <dir>/mnt/c/Windows/Fonts</dir>

  <!-- 中文优先用「等线」，缺失时回退到雅黑 -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DengXian</string></edit>
  </match>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>DengXian</family>
      <family>Microsoft YaHei</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>
</fontconfig>
