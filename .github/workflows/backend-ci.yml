name: backend-ci

# 目的：把「本机能过」变成「任何环境都能复现的门禁」。
# 审计 H8：仓库此前零提交、无 CI、ruff/mypy/bandit 均未安装。

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # CI 用独立测试库；conftest 会自动建库并拒绝与业务库同名
      DATABASE_URL: mysql+pymysql://pharmacy:e2e@127.0.0.1:3306/pharmacy_db
      JWT_SECRET_KEY: ci-only-secret-not-for-production
      APP_ENV: ci
      ST_ENABLED: "false"          # 不在 CI 下载 458MB 模型，语义测试自动降级
      ST_WARMUP_ON_STARTUP: "false"

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: pharmacy
          MYSQL_PASSWORD: e2e
          MYSQL_DATABASE: pharmacy_db
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与本机（开发机 3.14）保持一致：CI 若跑在更低版本上，
          # 3.14 特有的语法/行为差异就永远测不出来。
          python-version: "3.14"
          cache: pip

      - name: 安装依赖（CPU 版 torch，避免拉取 CUDA 轮子）
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu

      # 空库迁移测试：确保「新库 → alembic upgrade head」这条路始终可用
      - name: 空库执行迁移
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check

      # 语法门禁：不需要任何第三方 linter 就能拦住「根本无法导入」的提交
      - name: 语法编译检查
        working-directory: backend
        run: python -m compileall -q app

      - name: 全量测试
        working-directory: backend
        run: pytest tests/ -q

  lint-advisory:
    # 【为什么是 advisory】仓库此前从未跑过 ruff/mypy/bandit（审计 H8），
    # 存量告警数量未知。直接设为阻塞会让 CI 从第一天起就红灯，
    # 反而促使别人绕过门禁。因此：
    #   · 阻塞门禁放在 test job（语法编译 + 全量测试 + 空库迁移 + alembic check）；
    #   · 本 job 只**报告**静态分析与依赖漏洞，持续可见但不阻断。
    # 清理完存量后，把下面这行删掉即升级为阻塞。
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: ruff / mypy / bandit / pip-audit
        working-directory: backend
        run: |
          python -m pip install ruff mypy bandit pip-audit
          ruff check app
          mypy app --ignore-missing-imports
          bandit -r app -q
          pip-audit -r requirements.txt
