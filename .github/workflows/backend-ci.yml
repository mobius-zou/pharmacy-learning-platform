name: backend-ci

# 目的：把「本机能过」变成「任何环境都能复现的门禁」。
# 审计 H8：仓库此前零提交、无 CI、ruff/mypy/bandit 均未安装。

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # CI 用独立测试库；conftest 会自动建库并拒绝与业务库同名
      DATABASE_URL: mysql+pymysql://pharmacy:e2e@127.0.0.1:3306/pharmacy_db
      JWT_SECRET_KEY: ci-only-secret-not-for-production
      APP_ENV: ci
      ST_ENABLED: "false"          # 不在 CI 下载 458MB 模型，语义测试自动降级
      ST_WARMUP_ON_STARTUP: "false"

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: pharmacy
          MYSQL_PASSWORD: e2e
          MYSQL_DATABASE: pharmacy_db
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与本机（开发机 3.14）保持一致：CI 若跑在更低版本上，
          # 3.14 特有的语法/行为差异就永远测不出来。
          python-version: "3.14"
          cache: pip

      - name: 安装依赖（CPU 版 torch，避免拉取 CUDA 轮子）
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu

      # 空库迁移测试：确保「新库 → alembic upgrade head」这条路始终可用
      - name: 空库执行迁移
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check

      # 语法门禁：不需要任何第三方 linter 就能拦住「根本无法导入」的提交
      - name: 语法编译检查
        working-directory: backend
        run: python -m compileall -q app

      - name: 全量测试
        working-directory: backend
        run: pytest tests/ -q

  # 阻塞的静态门禁：ruff 棘轮规则集（见 backend/ruff.toml 与 docs/audit-fix/lint-baseline.md）
  # 只启用当前 100% 通过的规则，拦住「未定义名称 / 语法错误」这类会直接 500 的问题。
  lint-blocking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: ruff（棘轮规则集）
        working-directory: backend
        run: |
          python -m pip install ruff
          ruff check app

  lint-advisory:
    # 【为什么是 advisory】存量基线见 docs/audit-fix/lint-baseline.md：
    #   mypy 14 条、bandit 6 条（0 HIGH）、pip-audit 本机无法采集。
    # 直接阻塞会让 CI 从第一天起红灯，反而促使别人绕过门禁。因此：
    #   · 阻塞门禁 = test job + lint-blocking job（ruff 棘轮规则集）；
    #   · 本 job 只**报告** mypy/bandit/依赖漏洞，持续可见但不阻断。
    # 存量清零后删除下面这行即升级为阻塞（升级路径见基线文档）。
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: mypy / bandit / pip-audit（仅报告）
        working-directory: backend
        run: |
          python -m pip install mypy bandit pip-audit
          mypy app --ignore-missing-imports
          bandit -r app -q
          pip-audit -r requirements.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu
